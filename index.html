<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>leetMetric</h1>
<div class="user-container">
    <p>Enter your username below:</p>
    <div class="user-input-container">
<input type="text" placeholder="enter your username" id="user-input" >
    <button id="search">search</button>
    </div>
</div>
<div class="stats-container">
    <div class="progress">

        <div class="progress-item ">
          <div class="easyprogress circle">
            <span id="easy-label"> Easy</span>
          </div>
            </div>

        <div class="progress-item ">
          <div class="mediumprogress circle">
            <span id="medium-label"> Medium</span>
          </div>
           </div>

        <div class="progress-item ">
          <div class="hardprogress circle">
            <span id="hard-label"> Hard</span>
          
          </div>
        </div>
        
    </div>
   <div class="stats-cards"></div>
</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
